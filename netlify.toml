[build]
  command = "npm run build"
  publish = "dist"

# Pin the CI Node version so Netlify builds match local (avoids "works on my
# machine" from a Node mismatch). Vite 6 needs Node 18+.
[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/assetlinks.json"
  status = 200

[[headers]]
  for = "/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
