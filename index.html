<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F3F5FA" />
    <title>HeroKana</title>
    <script>
      // Resolve the theme before first paint so the status bar, <html>
      // background and splash match — prevents a light strip at the top in
      // dark mode (the JS theme update otherwise only lands after React mounts).
      (function () {
        try {
          var m = localStorage.getItem("hk-theme");
          if (m !== "dark" && m !== "light")
            m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var bg = m === "dark" ? "#0E1322" : "#F3F5FA";
          var ink = m === "dark" ? "#F0F2F8" : "#1E2540";
          var r = document.documentElement;
          r.style.setProperty("--hk-bg", bg);
          r.style.setProperty("--hk-ink", ink);
          r.style.background = bg;
          r.style.colorScheme = m;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/assets/app-icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <style>
      /* html/body track the resolved theme so no light strip shows at the top */
      html, body { background: var(--hk-bg, #f3f5fa); }
      /* splash shown until React mounts and replaces #root's content.
         Background matches the loading video's off-white. */
      #hk-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: #0e4fb0;
      }
      #hk-splash video { width: 200px; height: 200px; object-fit: contain; }
      #hk-splash .hk-wordmark {
        font-family: "Outfit", system-ui, sans-serif; font-size: 21px;
        font-weight: 800; letter-spacing: -0.02em; color: #fff;
      }
      #hk-splash .hk-loading {
        font-family: "Outfit", system-ui, sans-serif; font-size: 13px;
        font-weight: 600; letter-spacing: 0.04em; color: rgba(255,255,255,0.6);
      }
    </style>
    <div id="root">
      <div id="hk-splash">
        <video src="/assets/cat-loading.mp4" autoplay loop muted playsinline></video>
        <span class="hk-wordmark">HeroKana</span>
        <span class="hk-loading">Loading…</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
