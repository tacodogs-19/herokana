<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F3F5FA" />
    <title>HeroKana</title>
    <script>
      // Resolve the theme before first paint so the status bar, <html>
      // background and splash match — prevents a light strip at the top in
      // dark mode (the JS theme update otherwise only lands after React mounts).
      (function () {
        try {
          var m = localStorage.getItem("hk-theme");
          if (m !== "dark" && m !== "light")
            m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var bg = m === "dark" ? "#0E1322" : "#F3F5FA";
          var ink = m === "dark" ? "#F0F2F8" : "#1E2540";
          var r = document.documentElement;
          r.style.setProperty("--hk-bg", bg);
          r.style.setProperty("--hk-ink", ink);
          r.style.background = bg;
          r.style.colorScheme = m;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/assets/app-icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Zen+Maru+Gothic:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <style>
      /* html/body track the resolved theme so no light strip shows at the top. */
      html, body { background: var(--hk-bg, #f3f5fa); }

      /* In-page splash: themed background + masked cat with a loading ring,
         shown until React mounts (main.jsx fades it out). Bg follows the live
         theme, so it matches the app background in both light and dark. */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: var(--hk-bg, #f3f5fa);
        transition: opacity 0.4s ease;
      }
      #splash.hk-splash-hide { opacity: 0; pointer-events: none; }
      .splash-stage { position: relative; width: 128px; height: 128px; display: grid; place-items: center; }
      .splash-cat { width: 58px; height: 58px; }
      .splash-ring { position: absolute; inset: 0; width: 128px; height: 128px; animation: hk-spin 1.4s linear infinite; }
      .splash-ring circle { fill: none; stroke-width: 2.6; }
      .splash-track { stroke: rgba(29, 79, 215, 0.13); }
      .splash-arc { stroke: #1d4fd7; stroke-linecap: round; transform-origin: center; animation: hk-dash 1.4s ease-in-out infinite; }
      @keyframes hk-spin { 100% { transform: rotate(360deg); } }
      @keyframes hk-dash {
        0%   { stroke-dasharray: 1 132; stroke-dashoffset: 0; }
        50%  { stroke-dasharray: 90 132; stroke-dashoffset: -20; }
        100% { stroke-dasharray: 90 132; stroke-dashoffset: -122; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-ring { animation: none; }
        .splash-arc { animation: none; stroke-dasharray: 90 132; }
      }
    </style>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="splash-stage">
        <img class="splash-cat" src="/assets/cat-header.svg" alt="" />
        <svg class="splash-ring" viewBox="0 0 50 50">
          <circle class="splash-track" cx="25" cy="25" r="21" />
          <circle class="splash-arc" cx="25" cy="25" r="21" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
